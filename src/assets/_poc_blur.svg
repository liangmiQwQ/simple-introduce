<svg width="694" height="188" xmlns="http://www.w3.org/2000/svg">
  <style>
    * {
      font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Noto Sans", sans-serif, "Apple Color Emoji", "Segoe UI Emoji", "Segoe UI Symbol", "Noto Color Emoji";
    }

    @media (prefers-color-scheme: dark) {
      * { color: white; }
    }

    @media (prefers-color-scheme: light) {
      * { color: black; }
    }


    span {
      font-size: 56px;
      display: block;
      position: absolute;
      animation: blur 8000ms linear infinite;
      opacity: 0;
    }

    @keyframes blur {
      0% {
        opacity: 0;
        filter: blur(5px);
        transform: translateY(20px);
        animation-timing-function: ease;
      }
      12.5% { /* 1000/(2000*4) */
        opacity: 1;
        filter: blur(0px);
        transform: translateY(0px);
        animation-timing-function: linear;
      }
      25% { /* 2000/(2000*4) */
        opacity: 1;
        filter: blur(0px);
        transform: translateY(0px);
        animation-timing-function: ease;
      }
      37.5% { /* 3000/(2000*4) */
        opacity: 0;
        filter: blur(5px);
        transform: translateY(-20px);
        animation-timing-function: linear;
      }
      100% {
        opacity: 0;
        filter: blur(5px);
        transform: translateY(-20px);
      }
    }

    .line1 {
      top: 52px;
      animation-delay: 0s;
    }

    .line2 {
      top: 10px;
      animation-delay: 2s;
    }

    .line3 {
      top: 10px;
      animation-delay: 4s;
    }

    .line4 {
      top: 10px;
      animation-delay: 6s;
    }
  </style>
  
   <foreignObject width="694" height="188">
    <div xmlns="http://www.w3.org/1999/xhtml">
      <span class="line1">👋 Hi there, fellow developer</span>
      <span class="line2">📱 Tired of boring GitHub profiles?</span>
      <span class="line3">🎥 We make animated images from your words</span>
      <span class="line4">✨ Simple, clean, and actually cool</span>
    </div>
  </foreignObject>
</svg>

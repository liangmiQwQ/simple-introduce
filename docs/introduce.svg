<svg width="694" height="188" xmlns="http://www.w3.org/2000/svg"><style>@keyframes a{0%{opacity:0;filter:blur(5px);transform:translateY(20px);animation-timing-function:ease}10%{opacity:1;filter:blur(0px);transform:translateY(0px);animation-timing-function:linear}20%{opacity:1;filter:blur(0px);transform:translateY(0px);animation-timing-function:ease}30%{opacity:0;filter:blur(5px);transform:translateY(-20px);animation-timing-function:linear}100%{opacity:0;filter:blur(5px);transform:translateY(-20px)}}*{font-family:ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Noto Sans", sans-serif, "Apple Color Emoji", "Segoe UI Emoji", "Segoe UI Symbol", "Noto Color Emoji";text-align:center;}@media(prefers-color-scheme:dark){*{ color:#fff;background:#000}}@media(prefers-color-scheme:light){*{ color:#000;background:#fff}}span{font-size:56px;width:100%;display:block;position:absolute;animation:a 10000ms linear infinite;opacity:0}.l0{top:52px;animation-delay:0ms}.l1{top:10px;animation-delay:2000ms}.l2{top:10px;animation-delay:4000ms}.l3{top:52px;animation-delay:6000ms}.l4{top:10px;animation-delay:8000ms}</style><foreignObject width="694" height="188"><div xmlns="http://www.w3.org/1999/xhtml"><span class="l0">👋 Hi there, fellow developer</span><span class="l1">📱 Tired of boring GitHub profiles?</span><span class="l2">🎥 We make animated images from your words</span><span class="l3">✨ Simple, clean, and cool</span><span class="l4">😋 Learn more at https://introduce.liangmi.dev</span></div></foreignObject></svg>
